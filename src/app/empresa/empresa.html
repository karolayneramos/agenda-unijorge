<div class="pagina">
  <div class="formulario">
    <h1>{{ modo === 'criar' ? 'Cadastro de Empresa' : 'Editar Empresa' }}</h1>

    <p class="subtitulo">
      {{ modo === 'criar' ? 'Preencha os dados da empresa para registrar a organização.' : 'Atualize os dados da empresa.' }}
    </p>

    <p *ngIf="loading">Carregando...</p>
    <p *ngIf="erro" role="alert">{{ erro }}</p>
    <form *ngIf="!loading && formularioDisponivel" #formEmpresa="ngForm" (ngSubmit)="salvar()">
      <div class="campo">
        <label for="nome">Nome</label>
        <input
          id="nome"
          name="nome"
          type="text"
          [(ngModel)]="empresa.nome"
          placeholder="Digite o nome da empresa"
          required
        />
      </div>

      <div class="campo">
        <label for="cnpj">CNPJ</label>
        <input
          id="cnpj"
          name="cnpj"
          type="text"
          [(ngModel)]="empresa.cnpj"
          placeholder="00.000.000/0000-00"
          required
        />
      </div>

      <div class="campo">
        <label for="logomarca">Logomarca</label>
        <input
          id="logomarca"
          name="logomarca"
          type="url"
          [(ngModel)]="empresa.logomarca"
          placeholder="https://exemplo.com/logo.png"
          required
        />
      </div>

      <div class="campo">
        <label for="fundacao">Fundação</label>
        <input
          id="fundacao"
          name="fundacao"
          type="date"
          [(ngModel)]="empresa.fundacao"
          required
        />
      </div>

      <div class="campo">
        <label for="descricao">Descrição</label>
        <textarea
          id="descricao"
          name="descricao"
          rows="5"
          [(ngModel)]="empresa.descricao"
          placeholder="Descreva a empresa"
          required
        ></textarea>
      </div>

      <div class="botoes">
        <button type="button" class="botao-secundario" (click)="resetarFormulario()">
          Limpar
        </button>

        <button type="button" class="botao-secundario" (click)="voltar()">
          Voltar
        </button>

        <button type="submit" [disabled]="formEmpresa.invalid || saving">
          {{ saving ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </form>
  </div>
</div>

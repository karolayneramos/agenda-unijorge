<h2>Eventos</h2>
<div *ngIf="loading">Carregando...</div>
<div *ngIf="erro" role="alert">{{ erro }}</div>
<ul>
  <li *ngFor="let e of eventos">
    {{ e.titulo }} - {{ e.data }} ({{ e.local }})
    <button (click)="eventoSelecionado = e.id">Ver participantes</button>
  </li>
</ul>

<form (ngSubmit)="salvar()" style="margin-top:1rem">
  <input [(ngModel)]="evento.titulo" name="titulo" placeholder="Título" required />
  <input [(ngModel)]="evento.data" name="data" type="date" required />
  <input [(ngModel)]="evento.local" name="local" placeholder="Local" required />
  <input [(ngModel)]="evento.emailResponsavel" name="email" placeholder="E-mail responsável" required />
  <input [(ngModel)]="evento.vagas" name="vagas" type="number" required />
  <button type="submit">Cadastrar Evento</button>
</form>

<div *ngIf="eventoSelecionado">
  <app-participantes-evento [eventoId]="eventoSelecionado"></app-participantes-evento>
</div>
